services:
  api:
    build: .
    image: stockscan-api:0.1.0
    container_name: stockscan-api
    restart: unless-stopped
    ports:
      - "18080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mariadb
      SPRING_DATASOURCE_URL: jdbc:mariadb://192.168.35.2:3307/stockscan
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
