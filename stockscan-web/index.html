<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>StockScan 대시보드</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header>
        <h1>StockScan</h1>
        <div class="header-actions">
            <span id="status" class="status"></span>
            <button id="refresh" type="button">새로고침</button>
        </div>
    </header>

    <main>
        <section>
            <h2>현재 재고</h2>
            <table id="items">
                <thead>
                    <tr>
                        <th>품목명</th>
                        <th>바코드</th>
                        <th class="num">수량</th>
                        <th>최종 수정</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>

        <section>
            <h2>입출고 이력</h2>
            <table id="movements">
                <thead>
                    <tr>
                        <th>시각</th>
                        <th>바코드</th>
                        <th>구분</th>
                        <th class="num">수량</th>
                        <th class="num">처리 후 재고</th>
                        <th>메모</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
